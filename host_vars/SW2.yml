---
hostname: SW2
device_type: switch

management_vlan: 10
management_ip: 192.168.10.11
management_mask: 255.255.255.0
default_gateway: 192.168.10.1

vlans:
  - id: 10
    name: VLAN10

  - id: 20
    name: VLAN20

trunk_ports:
  - FastEthernet0/1

access_ports:
  - interface: FastEthernet0/3
    vlan: 10

  - interface: FastEthernet0/2
    vlan: 20

etherchannel:
  id: 1
  members:
    - FastEthernet0/4
    - FastEthernet0/5
  allowed_vlans: "10,20"