---
- name: Konfigurer trunk-porter
  hosts: switches
  gather_facts: false

  tasks:
    - name: Sett porter som trunk
      cisco.ios.ios_config:
        parents:
          - "interface {{ item }}"
        lines:
          - switchport mode trunk
          - switchport trunk allowed vlan 10,20
          - no shutdown
      loop: "{{ trunk_ports | default([]) }}"