---
- name: Konfigurer STUD2 CORE
  hosts: CORE
  gather_facts: false

  tasks:
    - name: Aktiver Layer 3 routing
      cisco.ios.ios_config:
        lines:
          - ip routing

    - name: Konfigurer routed interfaces
      cisco.ios.ios_config:
        parents:
          - "interface {{ item.interface }}"
        lines:
          - "description {{ item.description }}"
          - no switchport
          - "ip address {{ item.ip }} {{ item.mask }}"
          - no shutdown
      loop: "{{ routed_interfaces }}"

    - name: Konfigurer statiske ruter
      cisco.ios.ios_config:
        lines:
          - "ip route {{ item.network }} {{ item.mask }} {{ item.next_hop }}"
      loop: "{{ static_routes }}"

    - name: Lagre konfigurasjonen
      cisco.ios.ios_config:
        save_when: modified