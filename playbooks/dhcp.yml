---
- name: Konfigurer DHCP pa routere
  hosts: routers
  gather_facts: false

  tasks:
    - name: Ekskluder DHCP-adresser
      cisco.ios.ios_config:
        lines:
          - "ip dhcp excluded-address {{ item.start }} {{ item.end }}"
      loop: "{{ dhcp_excluded | default([]) }}"

    - name: Konfigurer DHCP-pools
      cisco.ios.ios_config:
        parents:
          - "ip dhcp pool {{ item.name }}"
        lines:
          - "network {{ item.network }} {{ item.mask }}"
          - "default-router {{ item.gateway }}"
      loop: "{{ dhcp_pools | default([]) }}"