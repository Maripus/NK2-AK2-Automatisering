---
- name: Konfigurer EtherChannel
  hosts: switches
  gather_facts: false

  tasks:
    - name: Legg porter i EtherChannel
      cisco.ios.ios_config:
        parents:
          - "interface {{ item }}"
        lines:
          - switchport mode trunk
          - "switchport trunk allowed vlan {{ etherchannel.allowed_vlans }}"
          - "channel-group {{ etherchannel.id }} mode active"
          - no shutdown
      loop: "{{ (etherchannel | default({})).members | default([]) }}"
      when: etherchannel is defined

    - name: Konfigurer Port-Channel som trunk
      cisco.ios.ios_config:
        parents:
          - "interface Port-channel{{ etherchannel.id }}"
        lines:
          - switchport mode trunk
          - "switchport trunk allowed vlan {{ etherchannel.allowed_vlans }}"
          - no shutdown
      when: etherchannel is defined
