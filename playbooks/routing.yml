---
- name: Konfigurer routing på CORE
  hosts: CORE
  gather_facts: false

  tasks:
    - name: Aktiver Layer 3 routing
      cisco.ios.ios_config:
        lines:
          - ip routing

    - name: Konfigurer management-interface
      cisco.ios.ios_config:
        parents:
          - "interface {{ management_interface }}"
        lines:
          - no switchport
          - "ip address {{ management_ip }} {{ management_mask }}"
          - no shutdown

    - name: Konfigurer routed interfaces
      cisco.ios.ios_config:
        parents:
          - "interface {{ item.interface }}"
        lines:
          - no switchport
          - "description {{ item.description }}"
          - "ip address {{ item.ip }} {{ item.mask }}"
          - no shutdown
      loop: "{{ routed_interfaces }}"

    - name: Konfigurer statiske ruter
      cisco.ios.ios_config:
        lines:
          - "ip route {{ item.network }} {{ item.mask }} {{ item.next_hop }}"
      loop: "{{ static_routes }}"


- name: Konfigurer routing på routere
  hosts: routers
  gather_facts: false

  tasks:
    - name: Konfigurer link mot CORE
      cisco.ios.ios_config:
        parents:
          - "interface {{ core_interface }}"
        lines:
          - "ip address {{ core_ip }} {{ core_mask }}"
          - no shutdown

    - name: Klargjor LAN-interface
      cisco.ios.ios_config:
        parents:
          - "interface {{ lan_interface }}"
        lines:
          - no ip address
          - no shutdown

    - name: Opprett VLAN-subinterface
      cisco.ios.ios_config:
        parents:
          - "interface {{ lan_interface }}.{{ router_vlan.id }}"
        lines:
          - "encapsulation dot1Q {{ router_vlan.id }}"
          - "ip address {{ router_vlan.gateway }} {{ router_vlan.mask }}"
          - no shutdown

    - name: Sett default route mot CORE
      cisco.ios.ios_config:
        lines:
          - "ip route 0.0.0.0 0.0.0.0 {{ default_route_next_hop }}"